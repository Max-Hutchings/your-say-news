# =============================
# Environments (ADR-055)
# =============================
# Profile names match our environment names - see "Environments" in AGENTS.md.
#   (no prefix) every environment. Must be safe on a server: hosted values or fail closed.
#   %local.     a developer laptop. Every quarkusDev run uses it (post-service/build.gradle.kts).
#   %test.      @QuarkusTest - lives in src/test/resources/application.properties.
#   %dev.       the hosted dev server (dev.yoursaynews.com). Set by QUARKUS_PROFILE in runtime.env.
#   %prod.      not built yet. Deliberately empty, so an image started as prod fails at startup.
#
# A profile is not a launch mode: the image always runs `java -jar` (normal mode) even as %dev.
# Rules:
#   - Secrets are only ever env vars, referenced in hosted profiles as ${NAME} with no default.
#   - %dev. and %prod. may only hold runtime properties. Build-time properties (root path, Quinoa,
#     db-kind, hibernate-orm) are baked into the image, so they live in base
#     and only %local./%test. may override them. EnvironmentConfigContractTest enforces this.

quarkus.application.name=post-service
quarkus.http.port=8082
# Hosted environments serve the API below /api (ADR-036). Build-time, so set once for every image.
quarkus.http.root-path=/api

# Names the environment on every metric's `environment` label. Set per profile only, never in base.
%local.app.environment=local
%dev.app.environment=dev

# =============================
# Admin Web UI
# =============================
# Quinoa builds the TypeScript/React admin app from src/main/webui. Its managed Vite server uses a
# separate port from the Expo web app on a laptop.
quarkus.quinoa.ui-root-path=/admin
quarkus.quinoa.build-dir=dist
quarkus.quinoa.dev-server.port=8083
quarkus.quinoa.enable-spa-routing=true
# Hosted images are API-only. Keep building the admin UI so it remains verified, but only serve it
# on a laptop.
quarkus.quinoa.just-build=true

# =============================
# OpenTelemetry / Grafana LGTM
# =============================
%test.quarkus.otel.enabled=false
quarkus.otel.logs.enabled=true
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.http-server.enabled=true
quarkus.log.console.json.enabled=true
quarkus.log.console.json.exception-output-type=formatted

# =============================
# HTTP Access Logging
# =============================
quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern={"remoteHost":"%h","method":"%m","path":"%U","status":%s,"bytes":%b}

# =============================
# AI research providers
# =============================
# All registered AI services use the OpenAI-compatible Responses API. Change this one property to
# switch Pepper, AutoPost and Unwrapped together. Each agent keeps a named model so its prompt cache,
# output budget and telemetry remain separate.
agent.provider=${AGENT_PROVIDER:openai}
agent.providers.openai.base-url=https://api.openai.com/v1
agent.providers.openai.api-key=${YOUR_SAY_NEWS_OPENAI_API_KEY:__not_configured__}
agent.providers.openai.model=${OPENAI_MODEL:gpt-5.6}
agent.providers.openai.reasoning-effort=${OPENAI_REASONING_EFFORT:low}
agent.providers.grok.base-url=https://api.x.ai/v1
agent.providers.grok.api-key=${YOUR_SAY_NEWS_GROK_API_KEY:${XAI_API_KEY:__not_configured__}}
agent.providers.grok.model=${GROK_MODEL:grok-4.5}
agent.api-key=${AGENT_API_KEY:${agent.providers.${agent.provider}.api-key}}
agent.model=${AGENT_MODEL:${agent.providers.${agent.provider}.model}}

# =============================
# Stage 7 unbiased-post agent
# =============================
pepper.agent.api-key=${PEPPER_API_KEY:${agent.api-key}}
pepper.agent.base-url=${PEPPER_BASE_URL:${agent.providers.${agent.provider}.base-url}}
pepper.agent.model=${PEPPER_MODEL:${agent.model}}
pepper.agent.max-output-tokens=4000
# Full provider responses can contain unbounded model-written content. Log them for every agent only
# on a laptop when generation fails, never on a server or in tests.
agent.log-full-failed-response=false
quarkus.langchain4j.openai.chat-model.enabled=true
quarkus.langchain4j.openai.chat-model.mode=responses
quarkus.langchain4j.openai.pepper.base-url=${pepper.agent.base-url}
quarkus.langchain4j.openai.pepper.api-key=${pepper.agent.api-key}
quarkus.langchain4j.openai.pepper.timeout=300s
quarkus.langchain4j.openai.pepper.max-retries=1
quarkus.langchain4j.openai.pepper.chat-model.model-name=${pepper.agent.model}
quarkus.langchain4j.openai.pepper.chat-model.strict-json-schema=true
quarkus.langchain4j.openai.pepper.chat-model.responses.max-output-tokens=${pepper.agent.max-output-tokens}
quarkus.langchain4j.openai.pepper.chat-model.responses.prompt-cache-key=unbiased-post-v1
pepper.replica-id=${HOSTNAME:local}

# Auto-post current-story discovery uses the selected provider but its own model identity, prompt
# cache and output budget. This keeps discovery telemetry/config separate from post drafting.
autopost.agent.api-key=${AUTOPOST_API_KEY:${agent.api-key}}
autopost.agent.base-url=${AUTOPOST_BASE_URL:${agent.providers.${agent.provider}.base-url}}
autopost.agent.model=${AUTOPOST_MODEL:${agent.model}}
autopost.agent.prompt-version=top-stories-v2
autopost.official-handle=yoursay
autopost.jobs.poll-interval=2s
quarkus.langchain4j.openai.autopost.base-url=${autopost.agent.base-url}
quarkus.langchain4j.openai.autopost.api-key=${autopost.agent.api-key}
quarkus.langchain4j.openai.autopost.timeout=300s
quarkus.langchain4j.openai.autopost.max-retries=1
quarkus.langchain4j.openai.autopost.chat-model.model-name=${autopost.agent.model}
quarkus.langchain4j.openai.autopost.chat-model.strict-json-schema=true
quarkus.langchain4j.openai.autopost.chat-model.responses.max-output-tokens=7000
quarkus.langchain4j.openai.autopost.chat-model.responses.prompt-cache-key=auto-post-top-stories-v2

# =============================
# Post Unwrapped research agent
# =============================
# Domain code depends only on UnwrappedResearchGenerator. The LangChain4j adapter keeps provider
# selection at the configuration boundary.
unwrapped.agent.api-key=${UNWRAPPED_API_KEY:${agent.api-key}}
%test.unwrapped.agent.api-key=__not_configured__
unwrapped.agent.model=${UNWRAPPED_MODEL:${agent.model}}
unwrapped.agent.base-url=${UNWRAPPED_BASE_URL:${agent.providers.${agent.provider}.base-url}}
quarkus.langchain4j.openai.unwrapped.base-url=${unwrapped.agent.base-url}
quarkus.langchain4j.openai.unwrapped.api-key=${unwrapped.agent.api-key}
quarkus.langchain4j.openai.unwrapped.timeout=300s
quarkus.langchain4j.openai.unwrapped.max-retries=0
quarkus.langchain4j.openai.unwrapped.chat-model.model-name=${unwrapped.agent.model}
quarkus.langchain4j.openai.unwrapped.chat-model.strict-json-schema=true
quarkus.langchain4j.openai.unwrapped.chat-model.responses.max-output-tokens=6000
quarkus.langchain4j.openai.unwrapped.chat-model.responses.prompt-cache-key=post-unwrapped-v2
unwrapped.jobs.poll-interval=2s
unwrapped.jobs.reconcile-interval=2s
unwrapped.jobs.claim-recovery-interval=1m
unwrapped.jobs.retry-enabled=false
# Feature flags (ADR-054). enabled=false is the kill switch: no generation, queueing or serving.
# unwrap-button=true shows vote results with an Unwrap button after voting; false opens Unwrapped
# straight after the vote. A voter's Unwrap tap queues generation at minimum-votes or more.
unwrapped.features.enabled=${UNWRAPPED_ENABLED:true}
unwrapped.features.unwrap-button=${UNWRAPPED_UNWRAP_BUTTON:true}
unwrapped.reader-generation.minimum-votes=500

# =============================
# CORS Configuration
# =============================
# Off by default: hosted environments serve the native app only, which does not need CORS. The
# laptop Expo web app (http://localhost:5173) and admin Vite server call cross-origin, so %local
# opts in.
quarkus.http.cors.enabled=false
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,x-pepper-replica,traceparent
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.access-control-max-age=86400

# =============================
# Mobile app telemetry relay
# =============================
# POST /telemetry/mobile re-sends the app's spans and logs as OTLP/JSON to this collector HTTP
# receiver under service.name=your-say-news-mobile. Unset (base, %test) means metrics only.
# mobile-telemetry.otlp.endpoint=

# =============================
# Firebase Authentication Configuration
# =============================
# FirebaseAuthenticationMechanism verifies Firebase ID tokens (and admin session cookies) with the
# Firebase Admin SDK in every environment except tests. Laptops use the Firebase Authentication
# Emulator (%local below); hosted environments read the project from FIREBASE_PROJECT_ID, which the
# deploy action also uses to validate the service-account JSON, so it has one source of truth.
firebase.auth.session-cookie-name=ysn_admin_session
firebase.auth.session-duration=12h

quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated
# Exclude OPTIONS so CORS preflight (sent without a bearer token) isn't rejected by auth
# before the CORS filter can answer it.
quarkus.http.auth.permission.authenticated.methods=GET,POST,PUT,DELETE,PATCH,HEAD
# The current admin placeholder contains no data or controls. Protect this route when the first
# administrative capability and browser login flow are introduced.
# Paths are relative (no leading slash) so Quarkus prefixes quarkus.http.root-path: /live locally,
# /api/live on hosted environments. An absolute path is never prefixed and would leave the hosted
# health check behind authentication.
quarkus.http.auth.permission.public.paths=live,q/health/*,admin,admin/*,api/auth/admin/csrf,api/auth/admin/session
quarkus.http.auth.permission.public.policy=permit

# =============================
# Datasource (Postgres)
# =============================
# post-service is reactive (Hibernate Reactive) AND uses JDBC for Liquibase and the user domains,
# so every environment sets both URLs.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.metrics.enabled=true
quarkus.datasource.jdbc.telemetry=true
# Statement counts and committed/rolled-back transaction counts. The Agroal pool metrics above only
# describe connections, so without this the Overview dashboard cannot show database query volume.
quarkus.hibernate-orm.metrics.enabled=true

# =============================
# Vote sentiment aggregation
# =============================
# k-anonymity suppression threshold for by-characteristic sentiment breakdowns: any bucket whose
# total vote count is below this is withheld from results. MVP1 ships k=0 (no suppression) — the
# single config flip that hardens against small-bucket re-identification (see roadmap risk #1).
# The hosted dev server keeps its existing value of 5 (%dev below). Changing either is a product
# decision, not a config clean-up.
votes.aggregation.suppress-below=0

# Hosted environments run the dedicated migration container before the app starts (ADR-035), so
# the app never migrates on startup there.
quarkus.liquibase.migrate-at-start=false
quarkus.liquibase.change-log=db/db.changelog-master.xml
quarkus.liquibase.enabled=true
# Liquibase owns the schema on the shared app_db. Hibernate must NOT generate it - dev mode otherwise
# defaults to drop-and-create, which would drop/recreate post tables (and a stray Vote table) and
# fight Liquibase / wipe seed data. This replaces the deprecated
# quarkus.hibernate-orm.database.generation.
quarkus.hibernate-orm.schema-management.strategy=none
# CharacteristicSnapshot is all-String so the global REST Jackson ObjectMapper is fine for JSONB
# serialization — no date/type ambiguity exists. This suppresses Quarkus's compatibility check.
quarkus.hibernate-orm.mapping.format.global=ignore

# =============================
# Known-benign startup log noise
# =============================
# Quarkus wires the Vert.x OpenTelemetry tracer after OIDC has already made its discovery calls to
# Keycloak, so every boot logs "VertxTracer delegate not set" once per startup HTTP call. Upstream
# bug (quarkusio/quarkus#39644); only boot-time internal calls are affected, request traces are
# unaffected. ERROR keeps any genuine tracing failure visible while dropping the boot noise. The
# logger is the VertxDelegator inner class, so the category must name it in full - a category for the
# outer class does not match, because log categories only nest on dots.
quarkus.log.category."io.quarkus.opentelemetry.runtime.tracing.instrumentation.vertx.OpenTelemetryVertxTracingFactory$VertxDelegator".level=ERROR
# post-service runs Hibernate ORM (blocking, user domains) and Hibernate Reactive (posts, topics)
# side by side, both on the persistence unit named "<default>". Quarkus keys persistence units by
# name AND a reactive flag, but hands the metrics recorder a name-only list, so the hibernate.*
# meters are offered twice and Micrometer logs one "already registered" warning per boot. The second
# registration is discarded, which is correct; splitting the units into distinct names would be the
# real fix and is a separate piece of work.
quarkus.log.category."io.micrometer.core.instrument.MeterRegistry".level=ERROR

# Reduce Liquibase logging
quarkus.log.category."liquibase".level=OFF
quarkus.log.category."liquibase.changelog".level=OFF
quarkus.log.category."liquibase.lockservice".level=OFF
quarkus.log.category."liquibase.executor".level=OFF
quarkus.log.category."liquibase.database".level=OFF

# =============================
# Media storage (S3-compatible)
# =============================
quarkus.s3.aws.credentials.type=static

# =============================================================================
# %local - developer laptop (bun run dev). Talks to the Compose stack in compose.yaml.
# =============================================================================
# Serve the admin UI and keep the laptop root paths (ADR-036).
%local.quarkus.quinoa.just-build=false
%local.quarkus.http.root-path=/
# Quarkus runs on the host and exports telemetry to the LGTM stack in compose.yaml.
%local.quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
%local.mobile-telemetry.otlp.endpoint=http://localhost:4318
%local.agent.log-full-failed-response=true
# Expo web (5173) and the admin Vite server (8083, 58083 for smoke tests) call cross-origin.
%local.quarkus.http.cors.enabled=true
%local.quarkus.http.cors.origins=http://localhost:5173,http://localhost:8083,http://localhost:58083
# Firebase Authentication Emulator. FIREBASE_AUTH_EMULATOR_HOST is set by mprocs.yaml because the
# Firebase Admin SDK only reads it from the environment. Allowed origins guard the laptop-only admin
# cookie session (AdminCsrfRequestFilter, AdminSessionController).
%local.firebase.auth.project-id=demo-your-say-news
%local.firebase.auth.allowed-origins=http://localhost:8082,http://localhost:8083,http://localhost:58083
%local.quarkus.http.auth.permission.dev-ui.paths=/q/*
%local.quarkus.http.auth.permission.dev-ui.policy=permit
# The shared Compose Postgres (populated by the migrate/seed containers) rather than a throwaway Dev
# Services container, so the running app sees the seeded data.
%local.quarkus.datasource.username=app_user
%local.quarkus.datasource.password=app_password
%local.quarkus.datasource.reactive.url=postgresql://localhost:5432/app_db
%local.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/app_db
%local.quarkus.liquibase.migrate-at-start=true
# LocalStack (path-style). Bucket matches localstack/init-aws.sh.
%local.quarkus.s3.endpoint-override=http://localhost:4566
%local.quarkus.s3.aws.region=us-east-1
%local.quarkus.s3.aws.credentials.static-provider.access-key-id=test
%local.quarkus.s3.aws.credentials.static-provider.secret-access-key=test
%local.quarkus.s3.path-style-access=true
%local.posts.media.bucket=post-videos

# =============================================================================
# %dev - hosted dev server (https://dev.yoursaynews.com/api). Runtime properties only.
# Secrets come from runtime.env (render-runtime-env.sh) and have no defaults.
# =============================================================================
%dev.quarkus.otel.exporter.otlp.endpoint=http://alloy:4317
%dev.mobile-telemetry.otlp.endpoint=http://alloy:4318
%dev.firebase.auth.project-id=${FIREBASE_PROJECT_ID}
%dev.quarkus.datasource.username=${DB_USERNAME}
%dev.quarkus.datasource.password=${DB_PASSWORD}
%dev.quarkus.datasource.jdbc.url=${DB_URL}
%dev.quarkus.datasource.reactive.url=${DB_REACTIVE_URL}
%dev.quarkus.datasource.jdbc.max-size=4
%dev.quarkus.datasource.reactive.max-size=8
%dev.agent.provider=${AGENT_PROVIDER}
%dev.agent.api-key=${AGENT_API_KEY}
%dev.agent.model=${AGENT_MODEL}
# Cloudflare R2 (virtual-hosted style).
%dev.quarkus.s3.endpoint-override=https://9538d45e127bdb7d6b1bf1ecf9020146.eu.r2.cloudflarestorage.com
%dev.quarkus.s3.aws.region=auto
%dev.quarkus.s3.aws.credentials.static-provider.access-key-id=${S3_ACCESS_KEY_ID}
%dev.quarkus.s3.aws.credentials.static-provider.secret-access-key=${S3_SECRET_ACCESS_KEY}
%dev.quarkus.s3.path-style-access=false
%dev.posts.media.bucket=your-say-news-media-development
# Unchanged from the pre-ADR-055 deployment value (was VOTE_SUPPRESSION_THRESHOLD in compose).
%dev.votes.aggregation.suppress-below=5

# =============================================================================
# %prod - not built yet (ADR-055). Leave empty until prod exists.
# =============================================================================
