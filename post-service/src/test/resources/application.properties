# =============================
# Test profile
# =============================
# Tests run against a REAL Postgres provided by Quarkus Dev Services (Testcontainers).
# No datasource URL is configured for %test, so Dev Services starts a throwaway
# Postgres container automatically — both the JDBC (Liquibase) and reactive clients use it.

# Liquibase runs the external combined schema and test seed fixtures.
%test.quarkus.liquibase.enabled=true
%test.quarkus.liquibase.migrate-at-start=true
%test.quarkus.liquibase.change-log=db/db.changelog-test.xml

# Auth is exercised via @TestSecurity; the Firebase beans are excluded with @UnlessBuildProfile("test").

# S3 isn't reached in tests (the S3Presigner is mocked), but give the SDK static creds/region
# so bean wiring succeeds without contacting AWS.
%test.quarkus.s3.aws.region=us-east-1
%test.quarkus.s3.aws.credentials.type=static
%test.quarkus.s3.aws.credentials.static-provider.access-key-id=test
%test.quarkus.s3.aws.credentials.static-provider.secret-access-key=test
%test.posts.media.bucket=post-videos

# Integration tests never call an external model. Pepper's generator is mocked by its endpoint tests; scheduled
# Unwrapped workers are disabled so their public entry points remain deterministic.
%test.agent.provider=openai
%test.agent.providers.openai.api-key=test-key-not-used
%test.unwrapped.jobs.poll-interval=off
%test.unwrapped.jobs.reconcile-interval=off
%test.unwrapped.jobs.claim-recovery-interval=off
%test.autopost.jobs.poll-interval=off

# The main base config is hosted-safe (ADR-055). Tests pin the laptop-shaped values they rely on
# here instead of inheriting %local: root paths without /api, the served admin UI, CORS for the admin
# Vite origin, and a fixed S3 endpoint so amazon-services Dev
# Services never starts a LocalStack container.
%test.app.environment=test
%test.quarkus.http.root-path=/
%test.quarkus.quinoa.just-build=false
%test.quarkus.http.cors.enabled=true
%test.quarkus.http.cors.origins=http://localhost:5173,http://localhost:8083,http://localhost:58083
%test.quarkus.s3.endpoint-override=http://localhost:4566
%test.quarkus.s3.path-style-access=true
