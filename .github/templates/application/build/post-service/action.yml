name: Build post-service snapshot image
description: Assemble post-service and build it into an image archive without publishing it.

inputs:
  image-artifact:
    description: Artifact name for the built image archive.
    required: true
  image-name:
    description: Final GHCR snapshot image name, used for the archive's commit tag.
    required: true
  short-sha:
    description: Seven-character commit SHA used in the image tag and archive provenance.
    required: true

runs:
  using: composite
  steps:
    - name: Assemble the post-service JVM application
      shell: bash
      run: |
        echo "::group::Assembling post-service for the image"
        ./gradlew :post-service:quarkusBuild
        echo "::endgroup::"

    - name: Build the post-service image archive
      uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
      with:
        context: ./post-service
        file: ./post-service/src/main/docker/Dockerfile.jvm
        platforms: linux/amd64
        push: false
        tags: ${{ inputs.image-name }}:sha-${{ inputs.short-sha }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.version=sha-${{ inputs.short-sha }}
        outputs: type=docker,dest=${{ runner.temp }}/post-service-image.tar

    - name: Upload the post-service image archive
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.image-artifact }}
        path: ${{ runner.temp }}/post-service-image.tar
        if-no-files-found: error
        retention-days: 1
