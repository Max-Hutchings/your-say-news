name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded PR runs only. A main run may be mid-deployment, so it always finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # user-service and post-service build + test as two independent, parallel
  # jobs (one runner each). Adding a module here is a one-line matrix change.
  backend:
    name: backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [post-service]
    env:
      # Testcontainers/Quarkus Dev Services talk to the runner's own Docker
      # daemon; bind the @QuarkusTest HTTP server to a random free port so it
      # can never clash with anything else on the runner.
      QUARKUS_HTTP_TEST_PORT: 0
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm
          java-version: 25

      # Restores the Gradle dependency/wrapper cache and validates the wrapper.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # `build` compiles, runs unit + Testcontainers integration tests, and
      # assembles the Quarkus app for this one module.
      - name: Build & test ${{ matrix.service }}
        run: ./gradlew :${{ matrix.service }}:build

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/build/reports/tests/
          if-no-files-found: ignore

      # deploy-development packages this tested build into the image instead of rebuilding it.
      - name: Upload the post-service application
        if: matrix.service == 'post-service' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: post-service-quarkus-app-${{ github.sha }}
          path: post-service/build/quarkus-app/
          if-no-files-found: error
          retention-days: 1

  # The Expo app is delivered via EAS Build, not from CI — so this job verifies
  # (typecheck + lint + jest) rather than producing a native binary.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/mobile/your-say-news
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # Node is required only to run jest-expo, which cannot execute under Bun.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      # Invoke the jest binary directly so it runs under Node, not Bun.
      # Run serially because coverage-instrumented React Native suites can exhaust the shared
      # runner's CPU when Jest forks workers, causing otherwise-fast async tests to hit 5s.
      - name: Test
        run: node_modules/.bin/jest --ci --runInBand

  admin-frontend:
    name: admin frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: post-service/src/main/webui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  # Only a push to main deploys, and only once every test job above has passed.
  deploy-development:
    name: deploy development
    needs: [backend, frontend, admin-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/dev-app.yml
    secrets: inherit
