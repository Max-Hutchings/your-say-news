name: Application Development

# Called only by CI (ci.yml) after every test job passes on a push to main. Tests, builds,
# publishes and deploys that exact commit to development; no branch or manual trigger can deploy.
on:
  workflow_call:

permissions:
  actions: read
  contents: read
  packages: read

env:
  POST_SERVICE_SNAPSHOT_IMAGE: ghcr.io/max-hutchings/your-say-news-post-service-snapshot
  MIGRATION_SNAPSHOT_IMAGE: ghcr.io/max-hutchings/your-say-news-migrations-snapshot
  ALLOY_IMAGE: grafana/alloy@sha256:491b0578c04983fd54fe99b587b6fab4404dc46d0dc16677bd6b00cc1140b308
  DEPLOYMENT_ROOT: /opt/your-say-news
  SSH_HOSTNAME: ssh-dev.yoursaynews.com
  PUBLIC_HEALTH_URL: https://dev.yoursaynews.com/api/live
  CLOUDFLARED_VERSION: 2026.7.3
  CLOUDFLARED_SHA256: 9d71c677db00134c1bd4144b7783486b654ad281b1ea62b4972098d19f770f17

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      short-sha: ${{ steps.test.outputs.short-sha }}
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@v6

      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test the commit snapshot
        id: test
        uses: ./.github/templates/application/test

  build-post-service-image:
    name: Build · Post-service image
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@v6

      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the post-service image
        uses: ./.github/templates/application/build/post-service
        with:
          image-artifact: post-service-snapshot-image-${{ needs.test.outputs.short-sha }}
          image-name: ${{ env.POST_SERVICE_SNAPSHOT_IMAGE }}
          short-sha: ${{ needs.test.outputs.short-sha }}

  build-migration-image:
    name: Build · Migration image
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@v6

      - name: Build the migration image
        uses: ./.github/templates/application/build/migration
        with:
          image-artifact: migration-snapshot-image-${{ needs.test.outputs.short-sha }}
          image-name: ${{ env.MIGRATION_SNAPSHOT_IMAGE }}
          short-sha: ${{ needs.test.outputs.short-sha }}

  publish:
    name: Publish · Commit snapshot
    needs:
      - test
      - build-post-service-image
      - build-migration-image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@v6

      - name: Publish and seal the commit snapshot
        uses: ./.github/templates/application/publish
        with:
          environment-name: development
          post-service-image-artifact: post-service-snapshot-image-${{ needs.test.outputs.short-sha }}
          migration-image-artifact: migration-snapshot-image-${{ needs.test.outputs.short-sha }}
          post-service-image: ${{ env.POST_SERVICE_SNAPSHOT_IMAGE }}
          migration-image: ${{ env.MIGRATION_SNAPSHOT_IMAGE }}
          short-sha: ${{ needs.test.outputs.short-sha }}
          deployment-artifact: application-development-snapshot-${{ needs.test.outputs.short-sha }}
          alloy-image: ${{ env.ALLOY_IMAGE }}

  deploy:
    name: Deploy · Development
    needs:
      - test
      - publish
    # Deployments queue rather than cancel, so a newer main push never interrupts a half-applied release.
    concurrency:
      group: application-development
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
      DB_URL: ${{ secrets.DEV_DB_JDBC_URL }}
      DB_REACTIVE_URL: ${{ secrets.DEV_DB_REACTIVE_URL }}
      MIGRATION_DB_USERNAME: ${{ secrets.DEV_DB_MIGRATION_USERNAME }}
      MIGRATION_DB_PASSWORD: ${{ secrets.DEV_DB_MIGRATION_PASSWORD }}
      DB_USERNAME: ${{ secrets.DEV_DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
      FIREBASE_PROJECT_ID: your-say-news-development
      FIREBASE_ADMIN_CREDENTIALS_JSON: ${{ secrets.DEV_FIREBASE_ADMIN_CREDENTIALS_JSON }}
      S3_ACCESS_KEY_ID: ${{ secrets.DEV_R2_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.DEV_R2_SECRET_ACCESS_KEY }}
      AGENT_PROVIDER: openai
      OPENAI_API_KEY: ${{ secrets.DEV_OPENAI_API_KEY }}
      GRAFANA_CLOUD_OTLP_ENDPOINT: ${{ secrets.DEV_GRAFANA_CLOUD_OTLP_ENDPOINT }}
      GRAFANA_CLOUD_OTLP_AUTHORIZATION: ${{ secrets.DEV_GRAFANA_CLOUD_OTLP_AUTHORIZATION }}
      # ADR-055: selects the image's %dev. config. Non-secret dev values live in application.properties.
      QUARKUS_PROFILE: dev
    steps:
      - name: Check out the exact source revision
        uses: actions/checkout@v6

      - name: Deploy the tested development snapshot
        uses: ./.github/templates/application/deploy
        with:
          environment-name: development
          snapshot-run-id: ${{ github.run_id }}
          commit-sha: ${{ github.sha }}
          artifact-prefix: application-development-snapshot
          github-token: ${{ github.token }}
          deployment-root: ${{ env.DEPLOYMENT_ROOT }}
          ssh-hostname: ${{ env.SSH_HOSTNAME }}
          public-health-url: ${{ env.PUBLIC_HEALTH_URL }}
          cloudflared-version: ${{ env.CLOUDFLARED_VERSION }}
          cloudflared-sha256: ${{ env.CLOUDFLARED_SHA256 }}
