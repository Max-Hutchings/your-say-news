# compose.yaml
services:
  # 1) App Postgres - Database for post-service
  postgres:
    image: postgres:16
    container_name: app-postgres
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - app-postgres-data:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2) Firebase Authentication Emulator for local mobile and admin sessions
  firebase-auth:
    build:
      context: .
      dockerfile: firebase/Dockerfile
    container_name: firebase-auth
    ports:
      - "9099:9099"
      - "4000:4000"
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:9099/emulator/v1/projects/demo-your-say-news/config');process.exit(r.ok?0:1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # 3) Reconcile the repository's login fixtures into Firebase on every startup
  firebase-auth-seed:
    build:
      context: .
      dockerfile: firebase/Dockerfile
    container_name: firebase-auth-seed
    depends_on:
      firebase-auth:
        condition: service_healthy
    environment:
      FIREBASE_AUTH_EMULATOR_HOST: firebase-auth:9099
      FIREBASE_PROJECT_ID: demo-your-say-news
    command: ["bun", "run", "seed"]
    networks:
      - app-net
    restart: "no"

  # 4) Liquibase migrations - applies post-service schema, then exits
  liquibase-migrate:
    build:
      context: .
      dockerfile: liquibase/Dockerfile.migrate
    container_name: liquibase-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/app_db
      DB_USERNAME: app_user
      DB_PASSWORD: app_password
    networks:
      - app-net
    restart: "no"

  # 5) Liquibase seeding - applies seed data (seeding/, context "seed") after migrations, then exits
  liquibase-seed:
    build:
      context: .
      dockerfile: liquibase/Dockerfile.seed
    container_name: liquibase-seed
    depends_on:
      liquibase-migrate:
        condition: service_completed_successfully
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/app_db
      DB_USERNAME: app_user
      DB_PASSWORD: app_password
    networks:
      - app-net
    restart: "no"

  # 6) LocalStack for S3 (used by post-service for video storage)
  localstack:
    image: localstack/localstack:3.0
    container_name: localstack
    ports:
      - "4566:4566"            # LocalStack Gateway
      - "4510-4559:4510-4559"  # External services port range
    environment:
      - SERVICES=s3
      - DEBUG=0
      - PERSISTENCE=1
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - localstack-data:/var/lib/localstack
      - ./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    networks:
      - app-net

  # 7) Local observability stack: Grafana UI, OTel Collector, Loki, Tempo, and Prometheus
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    container_name: otel-lgtm
    ports:
      - "3000:3000" # Grafana
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    volumes:
      - otel-lgtm-data:/data
      - ./grafana/provisioning/dashboards/your-say-news.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/your-say-news.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/your-say-news-dashboards:ro
    networks:
      - app-net

networks:
  app-net:

volumes:
  app-postgres-data:
  localstack-data:
  otel-lgtm-data:
