name: your-say-news-development

x-service-defaults: &service-defaults
  networks:
    - service
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  firebase-credentials:
    <<: *service-defaults
    image: ${POST_SERVICE_IMAGE:?POST_SERVICE_IMAGE must be an immutable image digest}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        umask 077 &&
        cp /source/firebase-admin.json /credentials/firebase-admin.json &&
        chown 185:185 /credentials/firebase-admin.json &&
        chmod 0400 /credentials/firebase-admin.json
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    volumes:
      - ${FIREBASE_ADMIN_CREDENTIALS_FILE:?FIREBASE_ADMIN_CREDENTIALS_FILE is required}:/source/firebase-admin.json:ro
      - firebase-credentials:/credentials
    restart: "no"

  migrate:
    <<: *service-defaults
    image: ${MIGRATION_IMAGE:?MIGRATION_IMAGE must be an immutable image digest}
    environment:
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USERNAME: ${MIGRATION_DB_USERNAME:?MIGRATION_DB_USERNAME is required}
      DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?MIGRATION_DB_PASSWORD is required}
    profiles:
      - migration
    restart: "no"

  post-service:
    <<: *service-defaults
    image: ${POST_SERVICE_IMAGE:?POST_SERVICE_IMAGE must be an immutable image digest}
    environment:
      QUARKUS_PROFILE: prod
      # Public remote endpoints live below /api; local development keeps its existing root paths.
      QUARKUS_HTTP_ROOT_PATH: /api
      QUARKUS_DATASOURCE_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      QUARKUS_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      QUARKUS_DATASOURCE_JDBC_URL: ${DB_URL:?DB_URL is required}
      QUARKUS_DATASOURCE_REACTIVE_URL: ${DB_REACTIVE_URL:?DB_REACTIVE_URL is required}
      QUARKUS_DATASOURCE_JDBC_MAX_SIZE: ${DB_JDBC_MAX_SIZE:-4}
      QUARKUS_DATASOURCE_REACTIVE_MAX_SIZE: ${DB_REACTIVE_MAX_SIZE:-8}
      QUARKUS_LIQUIBASE_MIGRATE_AT_START: "false"
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?FIREBASE_PROJECT_ID is required}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json
      QUARKUS_S3_ENDPOINT_OVERRIDE: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      QUARKUS_S3_AWS_REGION: ${S3_REGION:-auto}
      QUARKUS_S3_AWS_CREDENTIALS_TYPE: static
      QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      QUARKUS_S3_AWS_CREDENTIALS_STATIC_PROVIDER_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      QUARKUS_S3_PATH_STYLE_ACCESS: "false"
      POSTS_MEDIA_BUCKET: ${POSTS_MEDIA_BUCKET:?POSTS_MEDIA_BUCKET is required}
      AGENT_PROVIDER: ${AGENT_PROVIDER:?AGENT_PROVIDER is required}
      AGENT_API_KEY: ${AGENT_API_KEY:?AGENT_API_KEY is required}
      AGENT_MODEL: ${AGENT_MODEL:?AGENT_MODEL is required}
      QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      QUARKUS_HTTP_CORS_ENABLED: "false"
      VOTES_AGGREGATION_SUPPRESS_BELOW: ${VOTE_SUPPRESSION_THRESHOLD:-5}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:${POST_SERVICE_HOST_PORT:-8082}:8082"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8082; printf 'GET /api/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    depends_on:
      firebase-credentials:
        condition: service_completed_successfully
      alloy:
        condition: service_started
    volumes:
      - firebase-credentials:/run/secrets:ro

  alloy:
    <<: *service-defaults
    image: ${ALLOY_IMAGE:?ALLOY_IMAGE must be pinned}
    environment:
      GRAFANA_CLOUD_OTLP_ENDPOINT: ${GRAFANA_CLOUD_OTLP_ENDPOINT:?GRAFANA_CLOUD_OTLP_ENDPOINT is required}
      GRAFANA_CLOUD_OTLP_AUTHORIZATION: ${GRAFANA_CLOUD_OTLP_AUTHORIZATION:?GRAFANA_CLOUD_OTLP_AUTHORIZATION is required}
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy

networks:
  service:
    driver: bridge

volumes:
  alloy-data:
  firebase-credentials:
