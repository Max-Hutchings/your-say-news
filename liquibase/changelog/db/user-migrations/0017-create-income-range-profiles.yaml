                ('KR-KRW-GROSS-2024-v1','KR-KRW-GROSS',1,true,'KR','South Korea','KRW','GROSS_ANNUAL','Annual personal income before tax','Annual household income before tax','2024','2024-01-01',CURRENT_TIMESTAMP),
