                ('EU-EUR-GROSS-2024-v1','EU-EUR-GROSS',1,true,'EU','Euro area','EUR','GROSS_ANNUAL','Annual personal income before tax','Annual household income before tax','2024','2024-01-01',CURRENT_TIMESTAMP),
