                ('IN-INR-GROSS-2023-24-v1', ARRAY[200000,400000,700000,1200000,2000000,3500000]::BIGINT[], ARRAY[300000,600000,1000000,1800000,3000000,5000000]::BIGINT[]),
                ('US-USD-GROSS-2024-v1', ARRAY[25000,40000,60000,90000,135000,210000]::BIGINT[], ARRAY[30000,55000,85000,130000,195000,300000]::BIGINT[]),
                ('CN-CNY-GROSS-2024-v1', ARRAY[40000,70000,120000,180000,260000,410000]::BIGINT[], ARRAY[60000,100000,160000,250000,380000,580000]::BIGINT[]),
                ('EU-EUR-GROSS-2024-v1', ARRAY[15000,30000,45000,70000,100000,160000]::BIGINT[], ARRAY[25000,40000,60000,95000,145000,225000]::BIGINT[]),
                ('JP-JPY-GROSS-2024-v1', ARRAY[1500000,3000000,4500000,7000000,10000000,16000000]::BIGINT[], ARRAY[2500000,4000000,6500000,9500000,15000000,23000000]::BIGINT[]),
                ('CA-CAD-GROSS-2024-v1', ARRAY[25000,45000,70000,105000,155000,245000]::BIGINT[], ARRAY[35000,60000,95000,145000,225000,345000]::BIGINT[]),
                ('BR-BRL-GROSS-2024-v1', ARRAY[20000,35000,60000,90000,135000,210000]::BIGINT[], ARRAY[30000,50000,80000,125000,195000,300000]::BIGINT[]),
                ('AU-AUD-GROSS-2024-v1', ARRAY[30000,50000,80000,125000,185000,290000]::BIGINT[], ARRAY[40000,70000,115000,175000,265000,410000]::BIGINT[]),
                ('KR-KRW-GROSS-2024-v1', ARRAY[15000000,25000000,35000000,55000000,80000000,130000000]::BIGINT[], ARRAY[20000000,30000000,50000000,80000000,120000000,185000000]::BIGINT[]),
                ('MX-MXN-GROSS-2024-v1', ARRAY[80000,140000,240000,360000,540000,840000]::BIGINT[], ARRAY[120000,200000,320000,500000,780000,1200000]::BIGINT[]),
                ('RU-RUB-GROSS-2024-v1', ARRAY[350000,550000,850000,1300000,1950000,3050000]::BIGINT[], ARRAY[450000,750000,1200000,1850000,2850000,4350000]::BIGINT[]),
                ('CH-CHF-GROSS-2024-v1', ARRAY[20000,35000,60000,90000,130000,205000]::BIGINT[], ARRAY[30000,50000,80000,125000,190000,295000]::BIGINT[]),
                ('SG-SGD-GROSS-2024-v1', ARRAY[20000,30000,50000,75000,110000,175000]::BIGINT[], ARRAY[25000,45000,70000,105000,160000,250000]::BIGINT[]),
                ('HK-HKD-GROSS-2024-v1', ARRAY[80000,140000,240000,360000,540000,820000]::BIGINT[], ARRAY[120000,200000,320000,500000,780000,1180000]::BIGINT[]),
                ('ZA-ZAR-GROSS-2024-v1', ARRAY[80000,120000,200000,300000,460000,700000]::BIGINT[], ARRAY[100000,180000,280000,420000,660000,1000000]::BIGINT[]),
                ('SE-SEK-GROSS-2024-v1', ARRAY[170000,290000,460000,690000,1040000,1610000]::BIGINT[], ARRAY[230000,400000,630000,980000,1500000,2300000]::BIGINT[]),
                ('NO-NOK-GROSS-2024-v1', ARRAY[210000,340000,550000,830000,1240000,1930000]::BIGINT[], ARRAY[280000,480000,760000,1170000,1790000,2750000]::BIGINT[]),
                ('DK-DKK-GROSS-2024-v1', ARRAY[140000,230000,360000,550000,820000,1280000]::BIGINT[], ARRAY[180000,320000,500000,770000,1180000,1820000]::BIGINT[]),
                ('AE-AED-GROSS-2024-v1', ARRAY[40000,70000,110000,170000,250000,390000]::BIGINT[], ARRAY[60000,100000,150000,240000,360000,560000]::BIGINT[])
              ), measures AS (
                SELECT public_id, 'PERSONAL'::VARCHAR AS measure, personal AS boundaries FROM profile_boundaries
                UNION ALL
                SELECT public_id, 'HOUSEHOLD'::VARCHAR, household FROM profile_boundaries
              )
              INSERT INTO income_range_band (
                income_range_profile_id, band_code, measure, display_order,
                lower_inclusive, upper_exclusive, relative_tier)
              SELECT p.id, m.measure || '_TIER_' || tier, m.measure, tier,
                     CASE WHEN tier = 1 THEN NULL ELSE m.boundaries[tier - 1] END,
                     CASE WHEN tier = 7 THEN NULL ELSE m.boundaries[tier] END,
                     'TIER_' || tier
              FROM measures m
              JOIN income_range_profile p ON p.public_id = m.public_id
              CROSS JOIN generate_series(1, 7) tier;

              INSERT INTO income_range_profile_country (income_range_profile_id, country_code)
              SELECT p.id, c.country_code
              FROM (VALUES
                ('GB-GBP-GROSS-2025-v1','UNITED_KINGDOM'), ('IN-INR-GROSS-2023-24-v1','INDIA'),
                ('US-USD-GROSS-2024-v1','UNITED_STATES'), ('CN-CNY-GROSS-2024-v1','CHINA'),
                ('EU-EUR-GROSS-2024-v1','AUSTRIA'), ('EU-EUR-GROSS-2024-v1','BELGIUM'),
                ('EU-EUR-GROSS-2024-v1','CROATIA'), ('EU-EUR-GROSS-2024-v1','CYPRUS'),
                ('EU-EUR-GROSS-2024-v1','ESTONIA'), ('EU-EUR-GROSS-2024-v1','FINLAND'),
                ('EU-EUR-GROSS-2024-v1','FRANCE'), ('EU-EUR-GROSS-2024-v1','GERMANY'),
                ('EU-EUR-GROSS-2024-v1','GREECE'), ('EU-EUR-GROSS-2024-v1','IRELAND'),
                ('EU-EUR-GROSS-2024-v1','ITALY'), ('EU-EUR-GROSS-2024-v1','LATVIA'),
                ('EU-EUR-GROSS-2024-v1','LITHUANIA'), ('EU-EUR-GROSS-2024-v1','LUXEMBOURG'),
                ('EU-EUR-GROSS-2024-v1','MALTA'), ('EU-EUR-GROSS-2024-v1','NETHERLANDS'),
                ('EU-EUR-GROSS-2024-v1','PORTUGAL'), ('EU-EUR-GROSS-2024-v1','SLOVAKIA'),
                ('EU-EUR-GROSS-2024-v1','SLOVENIA'), ('EU-EUR-GROSS-2024-v1','SPAIN'),
                ('JP-JPY-GROSS-2024-v1','JAPAN'), ('CA-CAD-GROSS-2024-v1','CANADA'),
                ('BR-BRL-GROSS-2024-v1','BRAZIL'), ('AU-AUD-GROSS-2024-v1','AUSTRALIA'),
                ('KR-KRW-GROSS-2024-v1','SOUTH_KOREA'), ('MX-MXN-GROSS-2024-v1','MEXICO'),
                ('RU-RUB-GROSS-2024-v1','RUSSIA'), ('CH-CHF-GROSS-2024-v1','SWITZERLAND'),
                ('SG-SGD-GROSS-2024-v1','SINGAPORE'), ('ZA-ZAR-GROSS-2024-v1','SOUTH_AFRICA'),
                ('SE-SEK-GROSS-2024-v1','SWEDEN'), ('NO-NOK-GROSS-2024-v1','NORWAY'),
                ('DK-DKK-GROSS-2024-v1','DENMARK'), ('AE-AED-GROSS-2024-v1','UNITED_ARAB_EMIRATES')
              ) c(public_id, country_code)
              JOIN income_range_profile p ON p.public_id = c.public_id;

              INSERT INTO income_range_profile_source (
                income_range_profile_id, publisher, dataset, source_url, retrieved_at,
                derivation, confidence)
              SELECT p.id,
                     CASE WHEN p.market_code = 'GB' THEN 'Office for National Statistics'
                          WHEN p.market_code = 'IN' THEN 'Ministry of Statistics and Programme Implementation'
                          ELSE 'World Bank' END,
                     CASE WHEN p.market_code = 'GB' THEN 'Annual Survey of Hours and Earnings'
                          WHEN p.market_code = 'IN' THEN 'Periodic Labour Force Survey 2023-24'
                          ELSE 'Purchasing Power Parities for GDP' END,
                     CASE WHEN p.market_code = 'GB' THEN 'https://www.ons.gov.uk/employmentandlabourmarket/peopleinwork/earningsandworkinghours/bulletins/annualsurveyofhoursandearnings/latest'
                          WHEN p.market_code = 'IN' THEN 'https://www.mospi.gov.in/sites/default/files/publication_reports/AnnualReport_PLFS2023-24L2.pdf'
                          ELSE 'https://api.worldbank.org/v2/indicator/PA.NUS.PPP' END,
                     DATE '2026-08-11',
                     CASE WHEN p.market_code = 'GB' THEN 'ONS earnings distribution with rounded household cut points'
                          WHEN p.market_code = 'IN' THEN 'PLFS earnings evidence with rounded gross-income bands'
                          ELSE 'World Bank PPP-calibrated fallback, checked and rounded for the local market' END,
                     CASE WHEN p.market_code = 'GB' THEN 'HIGH' ELSE 'MEDIUM' END
              FROM income_range_profile p;

              ALTER TABLE user_characteristic
                ADD COLUMN income_range_profile_ref_id BIGINT REFERENCES income_range_profile(id),
                ADD COLUMN personal_income_band_ref_id BIGINT REFERENCES income_range_band(id),
                ADD COLUMN household_income_band_ref_id BIGINT REFERENCES income_range_band(id);

              UPDATE user_characteristic c
              SET income_range_profile_ref_id = p.id,
                  personal_income_band_ref_id = personal.id,
                  household_income_band_ref_id = household.id
              FROM income_range_profile p
              JOIN income_range_band personal ON personal.income_range_profile_id = p.id
              JOIN income_range_band household ON household.income_range_profile_id = p.id
              WHERE c.income_answer_version = 2
                AND p.public_id = c.income_profile_id
                AND personal.band_code = c.personal_income_band_id
                AND household.band_code = c.household_income_band_id;

              ALTER TABLE user_characteristic DROP CONSTRAINT chk_uc_income_answer_consistency;
              ALTER TABLE user_characteristic ADD CONSTRAINT chk_uc_income_answer_consistency CHECK (
                income_answer_version IS NOT NULL AND (
                  (income_answer_version = 1
                    AND personal_income_range IS NOT NULL AND household_income_range IS NOT NULL
                    AND income_catalog_version IS NULL AND income_profile_id IS NULL
                    AND income_profile_version IS NULL AND income_currency_code IS NULL
                    AND income_market_code IS NULL AND personal_income_band_id IS NULL
                    AND household_income_band_id IS NULL AND personal_income_tier IS NULL
                    AND household_income_tier IS NULL AND income_range_profile_ref_id IS NULL
                    AND personal_income_band_ref_id IS NULL AND household_income_band_ref_id IS NULL)
                  OR
                  (income_answer_version = 2
                    AND personal_income_range IS NULL AND household_income_range IS NULL
                    AND country_code IS NOT NULL AND income_catalog_version IS NOT NULL
                    AND income_profile_id IS NOT NULL AND income_profile_version IS NOT NULL
                    AND income_currency_code IS NOT NULL AND income_market_code IS NOT NULL
                    AND personal_income_band_id IS NOT NULL AND household_income_band_id IS NOT NULL
                    AND personal_income_tier IS NOT NULL AND household_income_tier IS NOT NULL
                    AND income_range_profile_ref_id IS NOT NULL
                    AND personal_income_band_ref_id IS NOT NULL AND household_income_band_ref_id IS NOT NULL)
                )
              );

              CREATE OR REPLACE FUNCTION reject_published_income_range_mutation()
              RETURNS trigger LANGUAGE plpgsql AS $$
              DECLARE profile_published TIMESTAMPTZ;
              DECLARE target_profile_id BIGINT;
              BEGIN
                target_profile_id := CASE WHEN TG_OP = 'DELETE'
                  THEN OLD.income_range_profile_id ELSE NEW.income_range_profile_id END;
                SELECT published_at INTO profile_published
                FROM income_range_profile
                WHERE id = target_profile_id;
                IF profile_published IS NOT NULL THEN
                  RAISE EXCEPTION 'Published income range profile data is immutable';
                END IF;
                IF TG_OP = 'DELETE' THEN RETURN OLD; END IF;
                RETURN NEW;
              END $$;

              CREATE TRIGGER trg_income_range_band_immutable
                BEFORE INSERT OR UPDATE OR DELETE ON income_range_band
                FOR EACH ROW EXECUTE FUNCTION reject_published_income_range_mutation();
              CREATE TRIGGER trg_income_range_source_immutable
                BEFORE INSERT OR UPDATE OR DELETE ON income_range_profile_source
                FOR EACH ROW EXECUTE FUNCTION reject_published_income_range_mutation();
              CREATE TRIGGER trg_income_range_country_immutable
                BEFORE INSERT OR UPDATE OR DELETE ON income_range_profile_country
                FOR EACH ROW EXECUTE FUNCTION reject_published_income_range_mutation();

              CREATE OR REPLACE FUNCTION reject_published_income_profile_mutation()
              RETURNS trigger LANGUAGE plpgsql AS $$
              BEGIN
                IF TG_OP = 'DELETE' AND OLD.published_at IS NOT NULL THEN
                  RAISE EXCEPTION 'Published income range profiles cannot be deleted';
                END IF;
                IF TG_OP = 'UPDATE' AND OLD.published_at IS NOT NULL AND (
                    NEW.public_id IS DISTINCT FROM OLD.public_id
                    OR NEW.profile_key IS DISTINCT FROM OLD.profile_key
                    OR NEW.version IS DISTINCT FROM OLD.version
                    OR NEW.market_code IS DISTINCT FROM OLD.market_code
                    OR NEW.market_label IS DISTINCT FROM OLD.market_label
                    OR NEW.currency_code IS DISTINCT FROM OLD.currency_code
                    OR NEW.income_basis IS DISTINCT FROM OLD.income_basis
                    OR NEW.personal_definition IS DISTINCT FROM OLD.personal_definition
                    OR NEW.household_definition IS DISTINCT FROM OLD.household_definition
                    OR NEW.source_year IS DISTINCT FROM OLD.source_year
                    OR NEW.effective_from IS DISTINCT FROM OLD.effective_from
                    OR NEW.published_at IS DISTINCT FROM OLD.published_at) THEN
                  RAISE EXCEPTION 'Published income range profile meaning is immutable';
                END IF;
                IF TG_OP = 'DELETE' THEN RETURN OLD; END IF;
                RETURN NEW;
              END $$;

              CREATE TRIGGER trg_income_range_profile_immutable
                BEFORE UPDATE OR DELETE ON income_range_profile
                FOR EACH ROW EXECUTE FUNCTION reject_published_income_profile_mutation();

              CREATE OR REPLACE FUNCTION validate_user_income_range_references()
              RETURNS trigger LANGUAGE plpgsql AS $$
              DECLARE profile_row income_range_profile%ROWTYPE;
              DECLARE personal_row income_range_band%ROWTYPE;
              DECLARE household_row income_range_band%ROWTYPE;
              BEGIN
                IF NEW.income_answer_version <> 2 THEN RETURN NEW; END IF;
                SELECT * INTO STRICT profile_row FROM income_range_profile WHERE id = NEW.income_range_profile_ref_id;
                SELECT * INTO STRICT personal_row FROM income_range_band WHERE id = NEW.personal_income_band_ref_id;
                SELECT * INTO STRICT household_row FROM income_range_band WHERE id = NEW.household_income_band_ref_id;
                IF profile_row.public_id <> NEW.income_profile_id
                   OR profile_row.version <> NEW.income_profile_version
                   OR profile_row.market_code <> NEW.income_market_code
                   OR profile_row.currency_code <> NEW.income_currency_code
                   OR personal_row.income_range_profile_id <> profile_row.id
                   OR personal_row.measure <> 'PERSONAL'
                   OR personal_row.band_code <> NEW.personal_income_band_id
                   OR personal_row.relative_tier <> NEW.personal_income_tier
                   OR household_row.income_range_profile_id <> profile_row.id
                   OR household_row.measure <> 'HOUSEHOLD'
                   OR household_row.band_code <> NEW.household_income_band_id
                   OR household_row.relative_tier <> NEW.household_income_tier THEN
                  RAISE EXCEPTION 'Versioned income references do not match their profile and measures';
                END IF;
                RETURN NEW;
              END $$;

              CREATE TRIGGER trg_user_income_range_references
                BEFORE INSERT OR UPDATE OF income_answer_version, income_profile_id,
                  income_profile_version, income_market_code, income_currency_code,
                  personal_income_band_id, household_income_band_id, personal_income_tier,
                  household_income_tier, income_range_profile_ref_id,
                  personal_income_band_ref_id, household_income_band_ref_id
                ON user_characteristic
                FOR EACH ROW EXECUTE FUNCTION validate_user_income_range_references();
