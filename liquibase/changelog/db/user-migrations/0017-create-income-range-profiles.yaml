                ('GB-GBP-GROSS-2025-v1','GB-GBP-GROSS',1,true,'GB','United Kingdom','GBP','GROSS_ANNUAL','Annual personal income before tax','Annual household income before tax','2025','2025-01-01',CURRENT_TIMESTAMP),
                ('IN-INR-GROSS-2023-24-v1','IN-INR-GROSS',1,true,'IN','India','INR','GROSS_ANNUAL','Annual personal income before tax','Annual household income before tax','2023-24','2023-04-01',CURRENT_TIMESTAMP),
                ('US-USD-GROSS-2024-v1','US-USD-GROSS',1,true,'US','United States','USD','GROSS_ANNUAL','Annual personal income before tax','Annual household income before tax','2024','2024-01-01',CURRENT_TIMESTAMP),
