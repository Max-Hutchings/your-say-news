                ('CA-CAD-GROSS-2024-v1','CA-CAD-GROSS',1,true,'CA','Canada','CAD','GROSS_ANNUAL','Annual personal income before tax','Annual household income before tax','2024','2024-01-01',CURRENT_TIMESTAMP),
                ('BR-BRL-GROSS-2024-v1','BR-BRL-GROSS',1,true,'BR','Brazil','BRL','GROSS_ANNUAL','Annual personal income before tax','Annual household income before tax','2024','2024-01-01',CURRENT_TIMESTAMP),
