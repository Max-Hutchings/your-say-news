databaseChangeLog:
  - changeSet:
      id: 0017-create-income-range-profiles
      author: codex
      logicalFilePath: db/migrations/0017-create-income-range-profiles.yaml
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: |
              CREATE TABLE income_range_profile (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                public_id VARCHAR(96) NOT NULL UNIQUE,
                profile_key VARCHAR(64) NOT NULL,
                version INTEGER NOT NULL CHECK (version > 0),
                active BOOLEAN NOT NULL DEFAULT FALSE,
                market_code VARCHAR(8) NOT NULL,
                market_label VARCHAR(96) NOT NULL,
                currency_code VARCHAR(3) NOT NULL CHECK (currency_code ~ '^[A-Z]{3}$'),
                income_basis VARCHAR(32) NOT NULL,
                personal_definition VARCHAR(160) NOT NULL,
                household_definition VARCHAR(160) NOT NULL,
                source_year VARCHAR(16) NOT NULL,
                effective_from DATE NOT NULL,
                published_at TIMESTAMPTZ,
                deactivated_at TIMESTAMPTZ,
                supersedes_profile_id BIGINT REFERENCES income_range_profile(id),
                created_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,
                updated_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT uq_income_range_profile_version UNIQUE (profile_key, version),
                CONSTRAINT chk_income_profile_active_published
                  CHECK (NOT active OR (published_at IS NOT NULL AND deactivated_at IS NULL))
              );

              CREATE UNIQUE INDEX uq_income_range_profile_active
                ON income_range_profile (market_code, currency_code, income_basis)
                WHERE active;

              CREATE TABLE income_range_profile_country (
                income_range_profile_id BIGINT NOT NULL REFERENCES income_range_profile(id),
                country_code VARCHAR(64) NOT NULL,
                PRIMARY KEY (income_range_profile_id, country_code)
              );

              CREATE TABLE income_range_band (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                income_range_profile_id BIGINT NOT NULL REFERENCES income_range_profile(id),
                band_code VARCHAR(48) NOT NULL,
                measure VARCHAR(16) NOT NULL CHECK (measure IN ('PERSONAL', 'HOUSEHOLD')),
                display_order INTEGER NOT NULL CHECK (display_order BETWEEN 1 AND 7),
                lower_inclusive BIGINT,
                upper_exclusive BIGINT,
                relative_tier VARCHAR(16) NOT NULL,
                CONSTRAINT uq_income_range_band_code UNIQUE (income_range_profile_id, band_code),
                CONSTRAINT uq_income_range_band_order UNIQUE (income_range_profile_id, measure, display_order),
                CONSTRAINT chk_income_range_band_ordered CHECK (
                  lower_inclusive IS NULL OR upper_exclusive IS NULL OR lower_inclusive < upper_exclusive
                )
              );

              CREATE TABLE income_range_profile_source (
                id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                income_range_profile_id BIGINT NOT NULL REFERENCES income_range_profile(id),
                publisher VARCHAR(160) NOT NULL,
                dataset VARCHAR(200) NOT NULL,
                source_url TEXT NOT NULL,
                retrieved_at DATE NOT NULL,
                derivation TEXT NOT NULL,
                confidence VARCHAR(16) NOT NULL CHECK (confidence IN ('HIGH', 'MEDIUM', 'LOW'))
              );

              INSERT INTO income_range_profile (
