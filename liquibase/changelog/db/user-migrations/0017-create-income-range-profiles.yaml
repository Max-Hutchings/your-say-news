                ('SE-SEK-GROSS-2024-v1','SE-SEK-GROSS',1,true,'SE','Sweden','SEK','GROSS_ANNUAL','Annual personal income before tax','Annual household income before tax','2024','2024-01-01',CURRENT_TIMESTAMP),
                ('NO-NOK-GROSS-2024-v1','NO-NOK-GROSS',1,true,'NO','Norway','NOK','GROSS_ANNUAL','Annual personal income before tax','Annual household income before tax','2024','2024-01-01',CURRENT_TIMESTAMP),
