databaseChangeLog:
  # Initial bootstrap used the established John fixture. The forward-only 0008 change separates
  # administration from publishing while preserving this already-applied changeset.
  - changeSet:
      id: 0007-seed-admin-account
      author: codex
      logicalFilePath: db/seeding/0007-seed-admin-account.yaml
      context: seed
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      # Rewritten for the publishing_enabled column (migration 0019). Already-seeded databases keep
      # their rows, which that migration backfills, so the edited checksum is accepted.
      validCheckSum:
        - "1:any"
      changes:
        - update:
            tableName: your_say_user
            columns:
              - column:
                  name: account_type
                  value: ADMIN
              - column:
                  name: publishing_enabled
                  valueBoolean: false
            where: email = 'john.doe@example.com'
