databaseChangeLog:
  # A 20-account voting population for the smoke suite's sentiment-breakdown journey.
  # Their political leaning drives a deliberately readable gradient (LEFT all agree through
  # RIGHT all disagree), so a breakdown assertion pins real numbers rather than 'a chart rendered'.
  # Ids 100-119 sit well above the hand-maintained development accounts so neither renumbers the
  # other. Keep these identities in sync with keycloak/realm-export.json.
  - changeSet:
      id: 0010-seed-smoke-vote-population
      author: claude
      logicalFilePath: db/seeding/0010-seed-smoke-vote-population.yaml
      context: seed
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
